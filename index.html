<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پەخشی ڕاستەوخۆی کەناڵی ڕووداو</title>
    
    <!-- Video.js CSS -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />

    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h2 {
            color: #ffcc00;
        }
        .player-container {
            max-width: 850px;
            margin: 30px auto;
            background: #1e1e1e;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }
        .video-js {
            width: 100%;
            height: 480px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <h2>پەخشی ڕاستەوخۆی تەلەڤیزیۆنی ڕووداو</h2>

    <div class="player-container">
        <video-js id="rudawPlayer" class="vjs-big-play-centered" controls preload="auto" data-setup='{}'>
            <source src="https://svs.itworkscdn.net/rudawlive.smil/playlist.m3u8" type="application/x-mpegURL" />
        </video-js>
    </div>

    <!-- Video.js and HLS Scripts -->
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

</body>
</html>

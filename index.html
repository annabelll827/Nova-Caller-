<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پشکنینی ژمارەی مۆبایل</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 70vh;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 {
            color: #333;
            margin-bottom: 5px;
        }
        p.subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        input {
            width: 90%;
            padding: 14px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            text-align: center;
            outline: none;
            transition: 0.3s;
        }
        input:focus {
            border-color: #007bff;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            display: none;
            text-align: right;
        }
        .result-box p {
            margin: 8px 0;
            color: #444;
            font-size: 15px;
        }
        .error {
            color: #dc3545 !important;
            text-align: center !important;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>سیستمی زانیاری ژمارە</h2>
        <p class="subtitle">ژمارەی مۆبایل بنووسە بۆ دۆزینەوەی ناو و شار</p>
        
        <input type="text" id="phoneInput" placeholder="نموونە: 07701234567" oninput="autoSearch()">

        <div id="resultBox" class="result-box">
            <p><strong>ناو:</strong> <span id="resName">-</span></p>
            <p><strong>شار:</strong> <span id="resCity">-</span></p>
        </div>
    </div>

    <script>
        // لێرەدا داتابەیسە کاتییەکەت دادەنێیت (دەتوانیت سەدان ژمارەی تێدا زیاد بکەیت)
        const database = {
            "07701234567": { name: "احمد محمد", city: "هەولێر" },
            "07509876543": { name: "سۆما عومەر", city: "سلێمانی" },
            "07801112233": { name: "کاروان علی", city: "بەغدا" },
            "07712345678": { name: "محەمەد قادر", city: "کەرکووک" },
            "07511112222": { name: "ڕۆژان ئەمین", city: "دهۆک" }
        };

        function autoSearch() {
            const phone = document.getElementById('phoneInput').value.trim();
            const resultBox = document.getElementById('resultBox');
            const resName = document.getElementById('resName');
            const resCity = document.getElementById('resCity');

            // ئەگەر خانەکە بەتاڵ بوو، ئەنجامەکە بشارەوە
            if (phone === "") {
                resultBox.style.display = "none";
                return;
            }

            // پشکنین لە ناو داتابەیسەکەدا
            if (database[phone]) {
                resName.textContent = database[phone].name;
                resCity.textContent = database[phone].city;
                resName.className = "";
                resultBox.style.display = "block";
            } else {
                // ئەگەر ژمارەکە نەدۆزرایەوە
                resName.textContent = "هیچ زانیارییەک بۆ ئەم ژمارەیە نەدۆزرایەوە";
                resName.className = "error";
                resCity.textContent = "-";
                resultBox.style.display = "block";
            }
        }
    </script>

</body>
</html>

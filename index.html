<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>feds.lol - Customize</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f0f11;
            color: #ffffff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Styling */
        aside {
            width: 260px;
            background-color: #141416;
            border-right: 1px solid #222226;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            position: fixed;
            height: 100%;
            top: 0;
            left: -260px;
            transition: 0.3s ease-in-out;
            z-index: 1000;
        }

        aside.active {
            left: 0;
        }

        .logo-area {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .close-btn {
            background: none;
            border: none;
            color: #a1a1aa;
            font-size: 20px;
            cursor: pointer;
            display: none;
        }

        .menu-section {
            margin-bottom: 20px;
        }

        .menu-title {
            font-size: 12px;
            color: #71717a;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            color: #a1a1aa;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 4px;
            transition: 0.2s;
        }

        .menu-item:hover, .menu-item.active {
            background-color: #1e1e24;
            color: #ffffff;
        }

        .user-profile-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 15px;
            border-top: 1px solid #222226;
        }

        .user-info .username {
            font-weight: 600;
            font-size: 13px;
        }

        .user-info .uid {
            color: #71717a;
            font-size: 11px;
        }

        /* Main Content Styling */
        main {
            flex: 1;
            overflow-y: auto;
            padding: 30px 40px;
            margin-left: 0;
            width: 100%;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .hamburger {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 5px;
        }

        .hamburger span {
            display: block;
            width: 22px;
            height: 2px;
            background-color: #ffffff;
            border-radius: 2px;
            transition: 0.3s;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 600;
        }

        .view-profile-btn {
            background: transparent;
            border: 1px solid #27272a;
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }

        .view-profile-btn:hover {
            background: #27272a;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            z-index: 999;
        }

        .overlay.active {
            display: block;
        }

        .tabs {
            display: flex;
            gap: 15px;
            border-bottom: 1px solid #222226;
            padding-bottom: 15px;
            margin-bottom: 30px;
            overflow-x: auto;
        }

        .tab {
            color: #71717a;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
        }

        .tab.active {
            color: #ffffff;
        }

        .card {
            background-color: #141416;
            border: 1px solid #222226;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 14px;
            color: #a1a1aa;
            margin-bottom: 15px;
        }

        .avatar-preview {
            width: 80px;
            height: 80px;
            background-color: #27272a;
            margin-bottom: 15px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
        }

        .avatar-preview.circle {
            border-radius: 50%;
        }

        .avatar-preview.square {
            border-radius: 0;
        }

        .avatar-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .avatar-preview span {
            color: #71717a;
            font-size: 11px;
            text-align: center;
            padding: 5px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background-color: #6366f1;
            color: white;
        }

        .btn-secondary {
            background-color: #27272a;
            color: white;
        }

        .shape-options {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .shape-btn {
            background: #1e1e24;
            border: 1px solid #27272a;
            color: #a1a1aa;
            padding: 6px 16px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
        }

        .shape-btn.active {
            border-color: #6366f1;
            color: #fff;
            background: #27272a;
        }

        @media(min-width: 1024px) {
            aside {
                left: 0;
                position: relative;
            }
            .hamburger {
                display: none;
            }
            .close-btn {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <aside id="sidebar">
        <div>
            <div class="logo-area">
                <span>⚡ feds.lol</span>
                <button class="close-btn" onclick="toggleMenu()">✕</button>
            </div>
            
            <div class="menu-section">
                <div class="menu-title">Dashboard</div>
                <a href="#" class="menu-item">Overview</a>
            </div>

            <div class="menu-section">
                <div class="menu-title">Customize</div>
                <a href="#" class="menu-item active">Profile</a>
                <a href="#" class="menu-item">Appearance</a>
                <a href="#" class="menu-item">Links</a>
                <a href="#" class="menu-item">Badges</a>
                <a href="#" class="menu-item">Widgets</a>
                <a href="#" class="menu-item">Tracks</a>
            </div>

            <div class="menu-section">
                <div class="menu-title">Manage</div>
                <a href="#" class="menu-item">Settings</a>
                <a href="#" class="menu-item">Templates</a>
            </div>
        </div>

        <div class="user-profile-box">
            <div class="user-info">
                <div class="username">zagros.gg</div>
                <div class="uid">UID 545,699,821</div>
            </div>
        </div>
    </aside>

    <main>
        <div class="header">
            <div class="header-left">
                <button class="hamburger" onclick="toggleMenu()">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <h1>Customize</h1>
            </div>
            <button class="view-profile-btn">View Profile</button>
        </div>

        <div class="tabs">
            <span class="tab active">Profile</span>
            <span class="tab">Appearance</span>
            <span class="tab">Links</span>
            <span class="tab">Badges</span>
            <span class="tab">Widgets</span>
            <span class="tab">Tracks</span>
        </div>

        <div class="card">
            <div class="card-title">Avatar</div>
            
            <div class="avatar-preview circle" id="avatar-box" onclick="document.getElementById('file-input').click()">
                <img id="avatar-img" src="" alt="Avatar">
                <span id="avatar-text">Drag & drop or click to upload</span>
            </div>
            
            <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="previewAvatar(this)">

            <div class="btn-group" id="btn-group">
                <button class="btn btn-primary" id="change-initial-btn" onclick="document.getElementById('file-input').click()">Change Avatar</button>
                
                <button class="btn btn-primary" id="save-btn" style="display: none;" onclick="saveAvatar()">Save Avatar</button>
                
                <button class="btn btn-primary" id="change-btn" style="display: none;" onclick="document.getElementById('file-input').click()">Change Avatar</button>
                <button class="btn btn-secondary" id="remove-btn" style="display: none;" onclick="removeAvatar()">Remove Avatar</button>
            </div>
            
            <div class="card-title" style="margin-top: 20px;">Avatar Shape</div>
            <div class="shape-options">
                <button class="shape-btn" onclick="changeShape('square', this)">Square</button>
                <button class="shape-btn active" onclick="changeShape('circle', this)">Circle</button>
            </div>
        </div>
    </main>

    <script>
        function toggleMenu() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        }

        let tempImageSrc = '';

        function previewAvatar(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    tempImageSrc = e.target.result;
                    const img = document.getElementById('avatar-img');
                    const text = document.getElementById('avatar-text');
                    img.src = tempImageSrc;
                    img.style.display = 'block';
                    text.style.display = 'none';

                    // کاتێک وێنە هەڵدەبژێردرێت، دوگمەی سەرەتایی دەشاردرێتەوە و Save Avatar دەردەکەوێت
                    document.getElementById('change-initial-btn').style.display = 'none';
                    document.getElementById('save-btn').style.display = 'block';
                    document.getElementById('change-btn').style.display = 'none';
                    document.getElementById('remove-btn').style.display = 'none';
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function saveAvatar() {
            // کاتێک Save دەکرێت، Save دەڕوات و Change و Remove دەردەکەون
            document.getElementById('save-btn').style.display = 'none';
            document.getElementById('change-btn').style.display = 'block';
            document.getElementById('remove-btn').style.display = 'block';
        }

        function removeAvatar() {
            const img = document.getElementById('avatar-img');
            const text = document.getElementById('avatar-text');
            const fileInput = document.getElementById('file-input');
            
            img.src = '';
            img.style.display = 'none';
            text.style.display = 'block';
            fileInput.value = '';
            tempImageSrc = '';

            // بە سڕینەوەی وێنە، دەگەڕێتەوە دۆخی سەرەتایی و تەنها Change Avatar دەردەکەوێت
            document.getElementById('change-initial-btn').style.display = 'block';
            document.getElementById('save-btn').style.display = 'none';
            document.getElementById('change-btn').style.display = 'none';
            document.getElementById('remove-btn').style.display = 'none';
        }

        function changeShape(shape, btn) {
            const box = document.getElementById('avatar-box');
            box.classList.remove('square', 'circle');
            box.classList.add(shape);

            document.querySelectorAll('.shape-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
    </script>

</body>
</html>
